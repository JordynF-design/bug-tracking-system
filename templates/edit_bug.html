<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Bug</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<main>
    <h1>Edit Bug Report</h1>

    <form method="POST">
        <label>Title</label>
        <input type="text" name="title" value="{{ bug['title'] }}" required>

        <label>Description</label>
        <textarea name="description" required>{{ bug['description'] }}</textarea>

        <label>Priority</label>
        <select name="priority">
            <option value="Low" {% if bug['priority'] == 'Low' %}selected{% endif %}>Low</option>
            <option value="Medium" {% if bug['priority'] == 'Medium' %}selected{% endif %}>Medium</option>
            <option value="High" {% if bug['priority'] == 'High' %}selected{% endif %}>High</option>
        </select>

        <label>Assigned To</label>
        <input type="text" name="assigned_to" value="{{ bug['assigned_to'] }}" required>

        <button type="submit">Save Changes</button>
    </form>

    <a href="/">Cancel</a>
</main>

</body>
</html>
